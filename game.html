<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي 30 ثانية ⚽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0D0D0D 0%, #1a1a1a 50%, #0D0D0D 100%);
            color: #FFFFFF;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ====== شريط المعلومات ====== */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 12px 18px;
            margin-bottom: 15px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 20px;
            font-weight: 900;
            color: #D4AF37;
        }

        /* ====== المؤقت ====== */
        .timer-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 15px auto;
        }

        .timer-circle {
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: rgba(212, 175, 55, 0.2);
            stroke-width: 8;
        }

        .timer-progress {
            fill: none;
            stroke: #D4AF37;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.3s;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: 900;
            color: #D4AF37;
        }

        .timer-danger .timer-progress { stroke: #E74C3C; }
        .timer-danger .timer-text { color: #E74C3C; }

        .timer-warning .timer-progress { stroke: #F39C12; }
        .timer-warning .timer-text { color: #F39C12; }

        /* ====== السؤال ====== */
        .difficulty-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .diff-easy { background: rgba(39, 174, 96, 0.2); color: #27AE60; border: 1px solid #27AE60; }
        .diff-medium { background: rgba(243, 156, 18, 0.2); color: #F39C12; border: 1px solid #F39C12; }
        .diff-hard { background: rgba(231, 76, 60, 0.2); color: #E74C3C; border: 1px solid #E74C3C; }

        .question-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 20px;
            text-align: center;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }

        /* ====== الأجوبة ====== */
        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 18px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-align: right;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s;
        }

        .answer-btn:active {
            transform: scale(0.98);
        }

        .answer-btn:hover {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
        }

        .answer-btn.correct {
            background: rgba(39, 174, 96, 0.3) !important;
            border-color: #27AE60 !important;
            color: #27AE60;
        }

        .answer-btn.wrong {
            background: rgba(231, 76, 60, 0.3) !important;
            border-color: #E74C3C !important;
            color: #E74C3C;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ====== النهاية ====== */
        .end-screen {
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .end-title {
            font-size: 32px;
            font-weight: 900;
            color: #D4AF37;
            margin-bottom: 20px;
        }

        .end-score {
            font-size: 70px;
            font-weight: 900;
            background: linear-gradient(135deg, #D4AF37, #F4D03F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .end-message {
            font-size: 18px;
            color: #999;
            margin-bottom: 30px;
        }

        .btn {
            padding: 16px 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #D4AF37;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            margin: 8px;
        }

        .btn-primary {
            background: #D4AF37;
            color: #0D0D0D;
        }

        .btn-primary:hover {
            background: #F4D03F;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #D4AF37;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* ====== بونص ====== */
        .bonus-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #D4AF37, #F4D03F);
            color: #0D0D0D;
            padding: 20px 35px;
            border-radius: 20px;
            font-size: 26px;
            font-weight: 900;
            animation: popIn 0.4s ease;
            z-index: 100;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.5);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- شريط المعلومات -->
        <div class="info-bar">
            <div class="info-item">
                <div class="info-label">السؤال</div>
                <div class="info-value" id="qProgress">1/25</div>
            </div>
            <div class="info-item">
                <div class="info-label">النقاط</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">الصحيح</div>
                <div class="info-value" id="correctCount">0</div>
            </div>
        </div>

        <!-- المؤقت -->
        <div class="timer-container" id="timerBox">
            <svg class="timer-circle" width="90" height="90">
                <circle class="timer-bg" cx="45" cy="45" r="38"></circle>
                <circle class="timer-progress" id="timerProgress" cx="45" cy="45" r="38"
                        stroke-dasharray="238.76" stroke-dashoffset="0"></circle>
            </svg>
            <div class="timer-text" id="timerText">30</div>
        </div>

        <!-- السؤال -->
        <div id="questionArea">
            <div style="text-align: center;">
                <span class="difficulty-badge" id="diffBadge">سهل</span>
            </div>
            <div class="question-box">
                <div class="category" id="category">أساسيات</div>
                <div class="question-text" id="questionText">جاري التحميل...</div>
            </div>
            <div class="answers" id="answersBox"></div>
        </div>

        <!-- شاشة النهاية -->
        <div class="end-screen hidden" id="endScreen">
            <div class="end-title">🏆 انتهى التحدي!</div>
            <div class="end-score" id="finalScore">0</div>
            <div class="end-message" id="endMessage"></div>
            <div>
                <a href="index.html" class="btn btn-secondary">🏠 الرئيسية</a>
                <button class="btn btn-primary" onclick="location.reload()">🔄 لعبة جديدة</button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="game.js"></script>
</body>
  </html>
