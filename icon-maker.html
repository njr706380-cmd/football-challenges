<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صانع أيقونات تحديات كروية</title>
<style>
    body {
        background: #0D0D0D;
        color: #D4AF37;
        font-family: 'Cairo', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        min-height: 100vh;
    }
    h1 { margin-bottom: 20px; color: #D4AF37; font-size: 24px; }
    .icon-box { margin: 20px 0; text-align: center; }
    .icon-box canvas {
        border: 2px solid #D4AF37;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }
    .label {
        font-size: 16px;
        margin-bottom: 12px;
        color: #F4D03F;
        font-weight: 700;
    }
    button {
        background: #D4AF37;
        color: #0D0D0D;
        padding: 12px 30px;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-family: 'Cairo', sans-serif;
    }
    button:hover { background: #F4D03F; }
</style>
</head>
<body>
<h1>⚽ صانع أيقونات تحديات كروية</h1>

<div class="icon-box">
    <div class="label">📱 512×512 (HD)</div>
    <canvas id="c512" width="512" height="512"></canvas>
    <br>
    <button onclick="download('c512', 'icon-512.png')">📥 تنزيل 512×512</button>
</div>

<div class="icon-box">
    <div class="label">📱 192×192 (عادي)</div>
    <canvas id="c192" width="192" height="192"></canvas>
    <br>
    <button onclick="download('c192', 'icon-192.png')">📥 تنزيل 192×192</button>
</div>

<script>
function drawIcon(canvas) {
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const c = size / 2;

    // خلفية سوداء متدرجة
    const bgGrad = ctx.createRadialGradient(c, c * 0.7, 0, c, c, c * 1.3);
    bgGrad.addColorStop(0, '#2a2a2a');
    bgGrad.addColorStop(0.5, '#141414');
    bgGrad.addColorStop(1, '#050505');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, size, size);

    // حلقة ذهبية خارجية
    ctx.beginPath();
    ctx.arc(c, c, size * 0.44, 0, Math.PI * 2);
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = size * 0.025;
    ctx.stroke();

    // حلقة ذهبية داخلية (رفيعة)
    ctx.beginPath();
    ctx.arc(c, c, size * 0.39, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
    ctx.lineWidth = size * 0.006;
    ctx.stroke();

    // وهج ذهبي خلف الكرة
    const glow = ctx.createRadialGradient(c, c, 0, c, c, size * 0.35);
    glow.addColorStop(0, 'rgba(212, 175, 55, 0.25)');
    glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    // كرة القدم (إيموجي)
    ctx.font = `${size * 0.55}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚽', c, c * 0.95);

    // نص "30" تحت الكرة
    ctx.font = `900 ${size * 0.18}px 'Cairo', Arial`;
    ctx.fillStyle = '#D4AF37';
    ctx.shadowColor = '#D4AF37';
    ctx.shadowBlur = size * 0.04;
    ctx.fillText('30', c, size * 0.85);
    ctx.shadowBlur = 0;
}

function download(canvasId, filename) {
    const canvas = document.getElementById(canvasId);
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// رسم الأيقونات
drawIcon(document.getElementById('c512'));
drawIcon(document.getElementById('c192'));
</script>
</body>
</html>
