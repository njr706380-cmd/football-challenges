<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديات كروية ⚽</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تحديات كروية">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0D0D0D 0%, #1a1a1a 50%, #0D0D0D 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 18px;
            color: #999;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .tagline span {
            color: #D4AF37;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border: 2px solid #D4AF37;
            background: transparent;
            color: #D4AF37;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background: #D4AF37;
            color: #0D0D0D;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .btn.primary {
            background: #D4AF37;
            color: #0D0D0D;
        }

        .btn.primary:hover {
            background: #F4D03F;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.6);
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #666;
        }

        .footer a {
            color: #D4AF37;
            text-decoration: none;
        }

        .sound-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
        }

        .install-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: #0D0D0D;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
            z-index: 1000;
            display: none;
        }

        .install-btn.show { display: block; }

        .fade-in {
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
    <button class="install-btn" id="installBtn">📲 ثبّت التطبيق</button>

    <div class="container fade-in">
        <div class="logo">⚽</div>
        <h1>تحديات كروية</h1>
        <p class="tagline">30 ثانية تحدٍ... <span>من يعرف أكثر؟</span></p>

        <div class="buttons">
            <a href="game.html" class="btn primary">🎯 تحدي 30 ثانية</a>
            <a href="online.html" class="btn">🌐 لعب أونلاين</a>
            <a href="#" class="btn" onclick="alert('قريباً... 🚀')">📊 لوحة الصدارة</a>
        </div>

        <div class="footer">
            صنع بـ ❤️ | <a href="https://github.com/njr706380-cmd">njr706380-cmd</a>
        </div>
    </div>

    <script src="sounds.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    initAudio();
                    playClick();
                });
            });
        });

        // تسجيل Service Worker
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js")
                    .then((reg) => console.log("SW registered:", reg.scope))
                    .catch((err) => console.log("SW failed:", err));
            });
        }

        // زر التثبيت (PWA)
        let deferredPrompt = null;
        const installBtn = document.getElementById("installBtn");

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.add("show");
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log("Install choice:", outcome);
            deferredPrompt = null;
            installBtn.classList.remove("show");
        });

        window.addEventListener("appinstalled", () => {
            console.log("PWA installed");
            installBtn.classList.remove("show");
        });
    </script>
</body>
</html>
