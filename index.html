<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديات كروية ⚽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0D0D0D 0%, #1a1a1a 50%, #0D0D0D 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 18px;
            color: #999;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .tagline span {
            color: #D4AF37;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border: 2px solid #D4AF37;
            background: transparent;
            color: #D4AF37;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background: #D4AF37;
            color: #0D0D0D;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .btn.primary {
            background: #D4AF37;
            color: #0D0D0D;
        }

        .btn.primary:hover {
            background: #F4D03F;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.6);
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #666;
        }

        .footer a {
            color: #D4AF37;
            text-decoration: none;
        }

        .fade-in {
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="logo">⚽</div>
        <h1>تحديات كروية</h1>
        <p class="tagline">30 ثانية تحدٍ... <span>من يعرف أكثر؟</span></p>

        <div class="buttons">
            <a href="game.html" class="btn primary">🎯 تحدي 30 ثانية</a>
            <a href="online.html" class="btn">🌐 لعب أونلاين</a>
            <a href="#" class="btn" onclick="alert('قريباً... 🚀')">📊 لوحة الصدارة</a>
        </div>

        <div class="footer">
            صنع بـ ❤️ | <a href="https://github.com/njr706380-cmd">njr706380-cmd</a>
        </div>
    </div>
</body>
</html>
